apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * Resolves the Google Maps Android API key without ever putting it in git.
 *
 * `android/` is committed here, so the manifest that `expo prebuild` writes is a tracked
 * file. app.config.js therefore feeds prebuild the literal placeholder token
 * `${GOOGLE_MAPS_API_KEY}` rather than the key, and the AGP manifest merger substitutes the
 * value resolved below. The secret lives only in `mobile/.env` (gitignored) and in the APK.
 *
 * Lookup order:
 *   1. the process environment — `expo run:android` and EAS both export `.env` / EAS-secret
 *      values into the Gradle child process;
 *   2. a Gradle property, for CI that would rather pass `-PGOOGLE_MAPS_API_KEY=…`;
 *   3. `mobile/.env` parsed directly, so a bare `./gradlew assembleDebug` still works.
 *
 * See ../../docs/google-maps-api-key.md.
 */
def resolveGoogleMapsApiKey = {
    def fromEnv = System.getenv("GOOGLE_MAPS_API_KEY")
    if (fromEnv) return fromEnv

    if (project.hasProperty("GOOGLE_MAPS_API_KEY")) {
        def fromProp = project.property("GOOGLE_MAPS_API_KEY")
        if (fromProp) return fromProp
    }

    def dotEnv = new File(projectRoot, ".env")
    if (dotEnv.exists()) {
        for (line in dotEnv.readLines()) {
            def trimmed = line.trim()
            if (trimmed.startsWith("#") || !trimmed.contains("=")) continue
            def idx = trimmed.indexOf("=")
            if (trimmed.substring(0, idx).trim() != "GOOGLE_MAPS_API_KEY") continue
            def value = trimmed.substring(idx + 1).trim()
            // Strip a single layer of surrounding quotes, as dotenv does.
            if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            if (value) return value
        }
    }

    logger.warn("GOOGLE_MAPS_API_KEY is not set. This build will have no Google Maps key and " +
            "every map surface will crash on mount. See mobile/docs/google-maps-api-key.md.")
    return ""
}

// ─────────────────────────────────────────────────────────────────────────────
// Which backend a `releaseDev` APK is allowed to talk to (STOURIFY-231)
// ─────────────────────────────────────────────────────────────────────────────
//
// A release-family build carries its JavaScript INSIDE the APK, and the backend
// address is compiled into that JavaScript. So once the file exists, the address
// is a fact about the file rather than a setting anyone can change afterwards.
//
// On 2026-08-28 a `releaseDev` APK built for a local test run pointed at the
// production backend, and two sign-in attempts reached it before anyone noticed.
// Nothing errored. Every request was answered — by the wrong server — which is
// precisely why nothing caught it. Think of a fire drill where the alarm panel has
// been wired to the building across the road: the panel goes green, the drill is
// recorded as passed, and nobody in this building hears a thing.
//
// The address came from `mobile/.env.production.local`, which is gitignored and
// which Expo loads ABOVE plain `mobile/.env` for any release-family build.
// `releaseDev` is a release build. So the file every testing document tells you to
// edit was quietly overruled.
//
// All the protection against that used to live in `scripts/mobile-apk-builder.ps1`,
// which hides that file for a dev build. That protects whoever types that command
// and nobody else — and an automated runner naturally types `./gradlew` directly.
// So the guard lives here now, in the build, where both commands meet.
//
// It REFUSES rather than quietly rerouting. Renaming a file the operator owns from
// inside a build that can be interrupted risks leaving their machine without it,
// and a silent reroute would mean two commands behaving differently with nothing
// on screen saying so — which is the same invisibility that caused this in the
// first place. A build failure is a better outcome than a test APK that reaches
// real users' data.
//
// See docs/testing/which-backend-the-app-is-tested-against.md and
// mobile/docs/building-a-dev-release-apk.md.

/** Reduce a web address to its origin: scheme, host and port, and nothing else. */
def apiOriginOf = { String url ->
    if (!url) return null
    def matcher = (url.trim() =~ /^([a-zA-Z][a-zA-Z0-9+.\-]*:\/\/[^\/]+)/)
    return matcher ? matcher[0][1] : null
}

/** Read one key out of a dotenv file, stripping a single layer of quotes as dotenv does. */
def readDotEnvValue = { File file, String key ->
    if (!file.exists()) return null
    for (line in file.readLines()) {
        def trimmed = line.trim()
        if (trimmed.startsWith("#") || !trimmed.contains("=")) continue
        def idx = trimmed.indexOf("=")
        if (trimmed.substring(0, idx).trim() != key) continue
        def value = trimmed.substring(idx + 1).trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        if (value) return value
    }
    return null
}

/**
 * Resolve EXPO_PUBLIC_API_URL the way Expo itself will, and say where it came from.
 *
 * The order matters and is not guessable. Expo's loader skips any key that is
 * ALREADY defined in the process environment — `@expo/env` logs "is already
 * defined and IS NOT overwritten" — so a shell export outranks every file. After
 * that, for a release-family build (NODE_ENV=production), it reads
 * `.env.production.local`, then `.env.local`, then `.env.production`, then `.env`.
 * Mirroring that order is the whole reason this guard can predict what the
 * bundler is about to do.
 */
def resolveExpoApiUrl = {
    def fromProcess = System.getenv("EXPO_PUBLIC_API_URL")
    if (fromProcess) return [value: fromProcess, source: "the process environment"]
    for (name in [".env.production.local", ".env.local", ".env.production", ".env"]) {
        def value = readDotEnvValue(new File(projectRoot, name), "EXPO_PUBLIC_API_URL")
        if (value) return [value: value, source: "mobile/" + name]
    }
    return [value: null, source: null]
}

/**
 * The origins a test build must never carry, read from the root `app.json`.
 *
 * Every entry under `deploy.environments` except `dev` is a tier this project
 * declares as non-development. Reading them rather than typing a hostname here
 * matters: a hostname written into a build file is a copy, and a copy goes stale
 * in silence the day a tier moves.
 *
 * Returns a map of origin -> tier name.
 */
def forbiddenTierOrigins = {
    def appJson = new File(projectRoot, "../app.json")
    def forbidden = [:]
    if (!appJson.exists()) return forbidden
    def parsed = new groovy.json.JsonSlurper().parse(appJson)
    def environments = parsed?.deploy?.environments
    if (!environments) return forbidden
    environments.each { name, settings ->
        if (name == "dev") return
        [settings?.url, settings?.mobileApiUrl].each { candidate ->
            def origin = apiOriginOf(candidate as String)
            if (origin) forbidden[origin] = name
        }
    }
    return forbidden
}

/**
 * Refuse the build if the address about to be compiled in is one a development
 * build must not carry. Three separate refusals, and each exists because the other
 * two cannot see its case.
 */
def assertDevApiUrlIsSafe = { String variantName ->
    def resolved = resolveExpoApiUrl()
    def devDeclaredApiUrl = readDotEnvValue(new File(projectRoot, ".env"), "EXPO_PUBLIC_API_URL")

    // 1. Nothing resolved at all. The app's own source falls back to the production
    //    address whenever the variable is unset and the build is not a development
    //    build — and a releaseDev build is not a development build. So "no value"
    //    is not a neutral state; it is a production build wearing a dev name.
    if (!resolved.value) {
        throw new GradleException(
            "\n" +
            "REFUSING to build ${variantName}: no EXPO_PUBLIC_API_URL is set anywhere.\n" +
            "\n" +
            "  That is not harmless. With nothing set, the app falls back to the address\n" +
            "  compiled into its own source, which for a non-development build is the\n" +
            "  production backend. This APK would talk to real users' data.\n" +
            "\n" +
            "  Fix: set EXPO_PUBLIC_API_URL in mobile/.env to the backend you are testing\n" +
            "  against. Start from mobile/.env.example, and see\n" +
            "  docs/testing/which-backend-the-app-is-tested-against.md.\n")
    }

    def origin = apiOriginOf(resolved.value)
    def forbidden = forbiddenTierOrigins()

    // 2. It belongs to a tier this project declares as non-development.
    if (forbidden.containsKey(origin)) {
        throw new GradleException(
            "\n" +
            "REFUSING to build ${variantName}: it would talk to the \"${forbidden[origin]}\" tier.\n" +
            "\n" +
            "    would bake in : ${resolved.value}\n" +
            "    read from     : ${resolved.source}\n" +
            "    declared in   : app.json -> deploy.environments.${forbidden[origin]}\n" +
            "\n" +
            "  A build meant for testing must never carry an address real users' data lives\n" +
            "  behind. Note that nothing would fail at run time — every request would be\n" +
            "  answered — which is exactly why this is stopped here instead.\n" +
            "\n" +
            "  If the source above is a .env file, it is one Expo loads ABOVE plain .env for\n" +
            "  any release-family build. Build through scripts/mobile-apk-builder.ps1\n" +
            "  -ReleaseDev, which hides it for the duration, or unset the value yourself.\n" +
            "  Do not delete that file: production builds need it.\n")
    }

    // 3. It disagrees with mobile/.env — the file every testing document tells you
    //    to edit, and the one the rig's own client-api-url-mismatch check reads.
    //    This is the refusal that closes the hole rather than listing the addresses
    //    already known to be dangerous.
    if (devDeclaredApiUrl) {
        def declaredOrigin = apiOriginOf(devDeclaredApiUrl)
        if (declaredOrigin != origin) {
            throw new GradleException(
                "\n" +
                "REFUSING to build ${variantName}: it would ignore what mobile/.env declares.\n" +
                "\n" +
                "    would bake in : ${resolved.value}\n" +
                "    read from     : ${resolved.source}\n" +
                "    mobile/.env   : ${devDeclaredApiUrl}\n" +
                "\n" +
                "  Compared by origin — scheme, host and port — so a trailing slash or a\n" +
                "  longer path is the same backend and would not have stopped here. A\n" +
                "  different port is a different server, which is the ordinary case on a\n" +
                "  machine running more than one.\n" +
                "\n" +
                "  Whatever the build read outranks mobile/.env, so editing mobile/.env alone\n" +
                "  would change nothing and say nothing. Fix the source named above.\n")
        }
    }

    logger.lifecycle("API URL for ${variantName}: ${resolved.value}  (from ${resolved.source})")
}

/**
 * Open the finished APK and read the address that actually went in.
 *
 * Every check above reads an INPUT, which makes it a prediction. This one opens the
 * file that is about to reach a phone, which makes it a fact. That distinction is
 * the whole lesson of STOURIFY-189 and STOURIFY-231: a check on what the rig
 * DECLARES can never say what the client CONSUMED.
 *
 * It uses java.util.zip.ZipFile rather than shelling out to `unzip`, so it behaves
 * the same on the Windows host this project builds on as anywhere else.
 */
def assertApkApiUrlIsSafe = { File apk, String variantName ->
    def zip = new java.util.zip.ZipFile(apk)
    def found = [] as Set
    try {
        def entry = zip.getEntry("assets/index.android.bundle")
        if (entry == null) {
            throw new GradleException(
                "\n" +
                "REFUSING ${apk.name}: it holds no assets/index.android.bundle, so there is\n" +
                "  no compiled-in address to read. A ${variantName} APK is supposed to carry\n" +
                "  its JavaScript inside it. Something went wrong in the bundling step.\n")
        }
        // Read the bytes as Latin-1 so every byte survives: the bundle is Hermes
        // bytecode, and the addresses sit in its string table as plain ASCII.
        def text = zip.getInputStream(entry).getText("ISO-8859-1")
        (text =~ /https?:\/\/[^"'`\s,;)]+\/api\/v1/).each { found << it }
    } finally {
        zip.close()
    }

    if (found.isEmpty()) {
        throw new GradleException(
            "\n" +
            "REFUSING ${apk.name}: its bundle carries no API address at all.\n" +
            "  \"I checked and it is fine\" and \"there was nothing to check\" look identical\n" +
            "  from here and mean opposite things, so this is not reported as a pass.\n")
    }

    def origins = found.collect { apiOriginOf(it) } as Set
    def forbidden = forbiddenTierOrigins()
    def hit = origins.find { forbidden.containsKey(it) }
    if (hit) {
        throw new GradleException(
            "\n" +
            "REFUSING ${apk.name}: the built APK talks to the \"${forbidden[hit]}\" tier.\n" +
            "    found inside : ${found.join(', ')}\n" +
            "  The input checks above passed and this one did not, which means something\n" +
            "  between them changed the value. Do not install this file.\n")
    }

    def devDeclaredApiUrl = readDotEnvValue(new File(projectRoot, ".env"), "EXPO_PUBLIC_API_URL")
    if (devDeclaredApiUrl) {
        def want = apiOriginOf(devDeclaredApiUrl)
        if (!origins.contains(want)) {
            throw new GradleException(
                "\n" +
                "REFUSING ${apk.name}: it does not carry the backend mobile/.env declares.\n" +
                "    expected     : ${want}\n" +
                "    found inside : ${found.join(', ')}\n" +
                "  Installing this and calling the result a live run would measure some other\n" +
                "  server. See docs/testing/which-backend-the-app-is-tested-against.md.\n")
        }
    }

    logger.lifecycle("Verified ${apk.name}: it talks to ${found.join(', ')}")
}

// ─────────────────────────────────────────────────────────────────────────────
// …and the same protection for the PRODUCTION build (STOURIFY-235)
// ─────────────────────────────────────────────────────────────────────────────
//
// Everything above guards the `releaseDev` variant. The production `release`
// variant had no build-time check at all: its protection lived entirely in
// scripts/mobile-apk-builder.ps1, which is precisely the wrapper-only shape
// STOURIFY-231 spent a card removing from the dev side. So
// `./gradlew assembleRelease` would compile whatever happened to resolve —
// somebody's laptop on their home network, say — into a public APK, and nothing
// at build time would say a word. Every request from that app would then fail
// for every user.
//
// A factory that x-rays every box on the export line and none on the domestic
// line is fine right up until a domestic box is shipped abroad.
//
// The comparison is INVERTED relative to the dev guard. There the question is
// "is this address forbidden?"; here it is "is this address the right one?" —
// a production build must carry the production tier's address and nothing
// belonging to another declared tier.

/**
 * The origins one declared tier answers on, read from the root `app.json`.
 *
 * `deploy.environments.<tier>.url` and `.mobileApiUrl`. Reading rather than
 * typing matters for the same reason it does above: a hostname written into a
 * build file is a copy, and a copy goes stale in silence the day a tier moves.
 *
 * An empty result means the tier is not declared, which every caller below
 * treats as a refusal rather than as "nothing to compare against".
 */
def tierOrigins = { String tierName ->
    def appJson = new File(projectRoot, "../app.json")
    def origins = [] as Set
    if (!appJson.exists()) return origins
    def parsed = new groovy.json.JsonSlurper().parse(appJson)
    def settings = parsed?.deploy?.environments?.get(tierName)
    if (!settings) return origins
    [settings?.url, settings?.mobileApiUrl].each { candidate ->
        def origin = apiOriginOf(candidate as String)
        if (origin) origins << origin
    }
    return origins
}

/** Every declared tier EXCEPT the named one, as a map of origin -> tier name. */
def otherTierOrigins = { String tierName ->
    def appJson = new File(projectRoot, "../app.json")
    def others = [:]
    if (!appJson.exists()) return others
    def parsed = new groovy.json.JsonSlurper().parse(appJson)
    def environments = parsed?.deploy?.environments
    if (!environments) return others
    environments.each { name, settings ->
        if (name == tierName) return
        [settings?.url, settings?.mobileApiUrl].each { candidate ->
            def origin = apiOriginOf(candidate as String)
            if (origin) others[origin] = name
        }
    }
    return others
}

/**
 * Refuse a build meant for a real tier when the address about to be compiled in
 * is not that tier's. Two refusals, and the first is not the obvious one.
 */
def assertProdApiUrlIsSafe = { String variantName, String tierName ->
    def wanted = tierOrigins(tierName)
    if (wanted.isEmpty()) {
        throw new GradleException(
            "\n" +
            "REFUSING to build ${variantName}: app.json declares no \"${tierName}\" tier with a\n" +
            "  url, so there is nothing to check this build against. A question that cannot\n" +
            "  be answered is not the same as one that passed.\n" +
            "\n" +
            "  Fix: declare it under app.json -> deploy.environments.${tierName}, or build\n" +
            "  with -PstourifyReleaseTier=<a tier that is declared>.\n")
    }

    def resolved = resolveExpoApiUrl()

    // 1. Nothing resolved at all. Since STOURIFY-232 the app carries no production
    //    address in its own source, so a release-family build with nothing set does
    //    not quietly reach production — it refuses to START. An unset variable is a
    //    dead app in every user's hands, which is worse than a failed build and
    //    invisible until they open it.
    if (!resolved.value) {
        throw new GradleException(
            "\n" +
            "REFUSING to build ${variantName}: no EXPO_PUBLIC_API_URL is set anywhere.\n" +
            "\n" +
            "  The app refuses to start without one, so this would ship an APK that dies on\n" +
            "  launch for everybody who installs it.\n" +
            "\n" +
            "  Fix: set it in mobile/.env.production.local — Expo loads that above\n" +
            "  mobile/.env for any release-family build — to ${wanted.join(', ')}.\n")
    }

    // 2. It resolved to something that is not this tier's address. This is the whole
    //    card: the dev guard asks whether an address is FORBIDDEN, and that question
    //    cannot see a laptop on somebody's home network, because no tier declares one.
    def origin = apiOriginOf(resolved.value)
    if (!wanted.contains(origin)) {
        throw new GradleException(
            "\n" +
            "REFUSING to build ${variantName}: it would not talk to the \"${tierName}\" backend.\n" +
            "\n" +
            "    would bake in : ${resolved.value}\n" +
            "    read from     : ${resolved.source}\n" +
            "    declared in   : app.json -> deploy.environments.${tierName}\n" +
            "    expected      : ${wanted.join(', ')}\n" +
            "\n" +
            "  Compared by origin — scheme, host and port — so a trailing slash or a longer\n" +
            "  path is the same backend and would not have stopped here.\n" +
            "\n" +
            "  Nothing would fail at build time, and nothing would fail at run time either:\n" +
            "  the app would simply talk to the wrong server, or to no server at all, for\n" +
            "  every user who installed it. That is why it is stopped here.\n" +
            "\n" +
            "  If this build is NOT for ${tierName}, say so on the command line —\n" +
            "  -PstourifyReleaseTier=dev builds for the local rig instead, under the same\n" +
            "  rules a releaseDev build gets.\n")
    }

    logger.lifecycle("API URL for ${variantName} (${tierName}): ${resolved.value}  (from ${resolved.source})")
}

/**
 * Open the finished tier APK and read the address that actually went in.
 *
 * The mirror of assertApkApiUrlIsSafe, with the rule flipped: the tier's own
 * address must be PRESENT, and no other declared tier's may be.
 *
 * The presence rule is the strong one here rather than the weak one, and it is
 * worth saying why, because it reads like the softer of the two. Since
 * STOURIFY-232 the production address exists nowhere in the app's own source, so
 * it can only be inside the bundle if this build resolved it and compiled it in.
 *
 * What it deliberately does not do is refuse an address it does not recognise.
 * mobile/src/shared/config/apiUrl.ts exports a loopback constant that travels in
 * every bundle whatever the build resolved, and a rule that refused unfamiliar
 * addresses would fire on the next third-party library and then get switched off.
 */
def assertApkIsProductionSafe = { File apk, String variantName, String tierName ->
    def wanted = tierOrigins(tierName)
    def zip = new java.util.zip.ZipFile(apk)
    def found = [] as Set
    try {
        def entry = zip.getEntry("assets/index.android.bundle")
        if (entry == null) {
            throw new GradleException(
                "\n" +
                "REFUSING ${apk.name}: it holds no assets/index.android.bundle, so there is\n" +
                "  no compiled-in address to read. A ${variantName} APK is supposed to carry\n" +
                "  its JavaScript inside it. Something went wrong in the bundling step.\n")
        }
        // Latin-1 so every byte survives: the bundle is Hermes bytecode, and the
        // addresses sit in its string table as plain ASCII.
        def text = zip.getInputStream(entry).getText("ISO-8859-1")
        (text =~ /https?:\/\/[^"'`\s,;)]+\/api\/v1/).each { found << it }
    } finally {
        zip.close()
    }

    if (found.isEmpty()) {
        throw new GradleException(
            "\n" +
            "REFUSING ${apk.name}: its bundle carries no API address at all.\n" +
            "  \"I checked and it is fine\" and \"there was nothing to check\" look identical\n" +
            "  from here and mean opposite things, so this is not reported as a pass.\n")
    }

    def origins = found.collect { apiOriginOf(it) } as Set

    if (!origins.any { wanted.contains(it) }) {
        throw new GradleException(
            "\n" +
            "REFUSING ${apk.name}: it does not carry the \"${tierName}\" backend.\n" +
            "    expected     : ${wanted.join(', ')}\n" +
            "    found inside : ${found.join(', ')}\n" +
            "  The input checks are predictions; this one read the finished file. Do not\n" +
            "  publish this APK — every request it makes would go somewhere else.\n")
    }

    def others = otherTierOrigins(tierName)
    def stray = origins.find { others.containsKey(it) }
    if (stray) {
        throw new GradleException(
            "\n" +
            "REFUSING ${apk.name}: it also carries the \"${others[stray]}\" tier's address.\n" +
            "    found inside : ${found.join(', ')}\n" +
            "  A build for one tier must not ship another one's address. Both would be\n" +
            "  answered at run time, which is exactly why this is read here instead.\n")
    }

    logger.lifecycle("Verified ${apk.name} for ${tierName}: it talks to ${found.join(', ')}")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.zivsluck.stourify'
    defaultConfig {
        // The Play Store identity, and it is PERMANENT after first publish —
        // a wrong value cannot be corrected without a new listing and the loss
        // of every install. It must match `expo.android.package` in app.json.
        //
        // History, because this value has moved twice and each move cost a
        // reinstall. It was the scaffold default `com.mobile` until 2026-07-29,
        // when the first attempt to run the app on a device caught it. It was
        // `app.stourify.mobile` from 2026-08-11 (STOURIFY-21) until 2026-08-16,
        // when it was set to `com.zivsluck.stourify` (STOURIFY-94) to sit under
        // the operator's own reverse-domain namespace alongside the other
        // products on that domain.
        //
        // `namespace` tracks it deliberately. Holding namespace back by hand was
        // tried and abandoned: `expo prebuild` derives it from
        // `expo.android.package` and moves the Kotlin source tree to match, so a
        // hand-held value only produced a diff that returned on the next
        // prebuild. This pipeline does not run prebuild (`android/` is
        // committed), so the source tree under `src/main/java/` and the `package`
        // declarations in MainActivity.kt / MainApplication.kt are moved by hand
        // to match — they are at `com/zivsluck/stourify/`. The launcher activity
        // is therefore `com.zivsluck.stourify.MainActivity`.
        //
        // Changing this again means every installed copy must be uninstalled
        // before the new one will install, losing anything created offline and
        // not yet synced. It also invalidates any Google Maps API key restricted
        // by package name.
        applicationId 'com.zivsluck.stourify'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.9.0"

        // Substituted into the `com.google.android.geo.API_KEY` meta-data that prebuild
        // writes as `${GOOGLE_MAPS_API_KEY}`. See resolveGoogleMapsApiKey above.
        manifestPlaceholders += [GOOGLE_MAPS_API_KEY: resolveGoogleMapsApiKey()]

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // The belt to `reactNativeArchitectures`' braces. That gradle.properties value tells
        // the React Native plugin which ABIs to BUILD; this tells AGP which ones may be
        // PACKAGED. They are not the same list — a third-party AAR ships prebuilt .so files
        // the RN property never sees, and those would otherwise ride along, re-inflating the
        // APK with armeabi-v7a/x86 libraries nothing here can call. Keep both in sync.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }

        // `releaseDev` — a release build you are allowed to test against a plain-HTTP
        // development server. STOURIFY-117.
        //
        // The problem it solves: only a release build embeds its JavaScript, so only a
        // release build can cold-start with no network. But Android bolts the door on
        // unencrypted HTTP for any app targeting API 28+, and the only backend this
        // project's rig may drive is an unencrypted `php artisan serve` on the
        // developer's own machine. So the artifact we need for offline testing was the
        // one artifact that could not reach the one server it was allowed to reach —
        // it could not even sign in.
        //
        // `initWith release` copies everything that makes a release build a release
        // build: the embedded JS bundle, the signing config, non-debuggable, the
        // shrinker settings, the ABI filters. The ONLY difference is the source set at
        // src/releaseDev/, which carries android:usesCleartextTraffic="true" exactly as
        // src/debug/ already does.
        //
        // Deliberately NOT done here, and each has a reason:
        //   - No applicationIdSuffix. The Google Maps key is restricted by package name,
        //     and root app.json names this package as the address every adb command in a
        //     live run is sent to. A suffix would fork both to let two builds sit on one
        //     device, which nothing needs.
        //   - Nothing is added to src/main. An opening on the main manifest ships to
        //     every user, forever; that is the whole point of putting it here instead.
        //     mobile/__tests__/android/cleartextTraffic.test.ts fails if anybody moves it.
        //
        // matchingFallbacks is not optional. Every Expo/React Native library module
        // publishes only `debug` and `release` variants, so without this line Gradle
        // cannot resolve a single dependency for a third build type and fails during
        // configuration, before it compiles anything.
        releaseDev {
            initWith release
            matchingFallbacks = ['release']
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// ── Wiring the two guards above into the build itself (STOURIFY-231) ─────────
//
// This is the part that matters. The same checks already existed inside
// scripts/mobile-apk-builder.ps1, where they protected whoever ran that command
// and nobody else. Attaching them to the tasks means `./gradlew assembleReleaseDev`
// and the PowerShell wrapper are protected identically, and there is no longer a
// way to build this variant that skips them.
//
// `configureEach` rather than `tasks.named(...)`: these tasks are created by the
// Android and React Native plugins later in the build, so naming them directly here
// would fail with "task not found" depending on evaluation order.
// ── Which tasks mean "a releaseDev artifact is really being produced" ────────
//
// This list is the fix for STOURIFY-234, and the story behind it is worth the
// paragraph because the mistake is an easy one to make again.
//
// The first version of this guard decided whether to refuse by asking "is the task
// called `preReleaseDevBuild` running?". That reads like a precise question about
// the releaseDev variant. It is not one. Gradle runs that task during an ordinary
// production `assembleRelease` as well, so on the day of the first production
// release the build refused itself and no APK could be made at all.
//
// The reason is in the task names, and `./gradlew assembleRelease --dry-run` shows
// it plainly. Android's C++ compilation tasks are named after the CMAKE build type
// — `configureCMakeRelWithDebInfo` — not after the Android variant. `release` and
// `releaseDev` both compile their native code as RelWithDebInfo, so there is one
// shared set of those tasks, and a shared task has to wait for the setup step of
// EVERY variant that uses it. That is what drags `preReleaseDevBuild` into the
// production build's list. (Control: `assembleDebug --dry-run` uses CMake `Debug`,
// shares nothing, and contains no releaseDev task at all.)
//
// A bouncer told to turn away anyone with a visitor badge, posted at the door
// everybody walks through, does not let the wrong people in — he stops everybody.
//
// So the question is asked of the TASK GRAPH instead, which is the thing that
// actually decides what a build will do, and it is keyed on tasks that only a
// releaseDev assembly ever puts there. Measured on the same dry-run:
// `preReleaseDevBuild` is the ONLY releaseDev-named task in the production graph,
// out of roughly six hundred, and none of the four below appears in it.
def releaseDevArtifactTasks = [
    "assembleReleaseDev",
    "packageReleaseDev",
    "bundleReleaseDev",
    "createBundleReleaseDevJsAndAssets",
]

// The fast refusal, and note what it is FOR: speed, not safety.
//
// Gradle hands the whole task list to `whenReady` before it executes anything, so
// this refuses in seconds rather than after several minutes of native compilation
// — earlier, in fact, than the old check managed. But the check that makes the
// answer CORRECT is the one on the bundling task below, which is where the address
// is really compiled in. Keeping those two jobs apart is the point: the old code
// made the fast check load-bearing, so being wrong about the graph meant being
// wrong about safety. Now, if this list ever goes stale against a future Android
// plugin, the cost is a slower refusal and never a missing one.
def releaseDevAnchorPaths = releaseDevArtifactTasks.collect { "${project.path}:${it}".toString() } as Set
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { releaseDevAnchorPaths.contains(it.path) }) {
        assertDevApiUrlIsSafe("releaseDev")
    }
}

tasks.configureEach { task ->
    // The refusal that is actually load-bearing. Nothing can bake an address into
    // the JavaScript without running this task, so nothing can get past it.
    if (task.name == "createBundleReleaseDevJsAndAssets") {
        task.doFirst { assertDevApiUrlIsSafe("releaseDev") }
    }

    // …and the artifact check goes at the very end, after packaging. It is not
    // redundant with the one above: bundling can be skipped as up to date, and an
    // input check is a prediction while this reads the finished file.
    if (task.name == "assembleReleaseDev") {
        task.doLast {
            def outputDir = new File(buildDir, "outputs/apk/releaseDev")
            def apks = outputDir.exists()
                ? outputDir.listFiles({ File dir, String name -> name.endsWith(".apk") } as FilenameFilter)
                : null
            if (apks == null || apks.length == 0) {
                throw new GradleException(
                    "\n" +
                    "assembleReleaseDev produced no APK in ${outputDir}, so nothing could be\n" +
                    "  verified. That is not a pass — see STOURIFY-231.\n")
            }
            apks.each { assertApkApiUrlIsSafe(it, "releaseDev") }
        }
    }
}

// ── …and the same wiring for the production build (STOURIFY-235) ─────────────
//
// The dev side above asks "is a releaseDev artifact really being produced?" and
// answers it from the task graph. The production side cannot ask that question,
// and the reason is worth the paragraph because it is the trap this card nearly
// walked into.
//
// The `release` variant does not tell you which tier a build is for. Two
// different, legitimate builds use it:
//
//   scripts/mobile-apk-builder.ps1 -Target production  → the public download page
//   scripts/mobile-apk-builder.ps1 -Target dev         → the private dev channel,
//                                                        pointed at a local rig
//
// The second hides mobile/.env.production.local for the duration so the local
// address wins. So a rule of "a release build must carry production's address"
// would refuse a build somebody runs on purpose — which is exactly the bug
// STOURIFY-234 had just finished fixing, one door along.
//
// So the CALLER says which tier, and silence means production. That default is
// the whole point: the build this card exists for is the one nobody was thinking
// about — an automated runner, or a stray `./gradlew assembleRelease` — and that
// one now refuses. A caller who types -PstourifyReleaseTier=dev has said out loud
// which tier they meant, and is then held to that tier's rules rather than to
// none at all.
def releaseTierName = (findProperty("stourifyReleaseTier") ?: "production").toString()

// `dev` is the one value that is not a tier lookup. It means "this release build
// is a test build for the local rig", and the rules for that already exist — they
// are the same three the releaseDev variant gets. Any other value is read as a
// tier name out of app.json, and a name that is not declared there is a refusal
// rather than a build with nothing to compare against.
def assertReleaseApiUrlIsSafe = {
    if (releaseTierName == "dev") {
        assertDevApiUrlIsSafe("release (dev channel)")
    } else {
        assertProdApiUrlIsSafe("release", releaseTierName)
    }
}

def assertReleaseApkIsSafe = { File apk ->
    if (releaseTierName == "dev") {
        assertApkApiUrlIsSafe(apk, "release (dev channel)")
    } else {
        assertApkIsProductionSafe(apk, "release", releaseTierName)
    }
}

tasks.configureEach { task ->
    // The refusal that is actually load-bearing, exactly as on the dev side:
    // nothing can bake an address into the JavaScript without running this task.
    if (task.name == "createBundleReleaseJsAndAssets") {
        task.doFirst { assertReleaseApiUrlIsSafe() }
    }

    // …and the artifact check after packaging, which reads a fact rather than
    // making a prediction. Bundling can be skipped as up to date; this cannot.
    if (task.name == "assembleRelease") {
        task.doLast {
            def outputDir = new File(buildDir, "outputs/apk/release")
            def apks = outputDir.exists()
                ? outputDir.listFiles({ File dir, String name -> name.endsWith(".apk") } as FilenameFilter)
                : null
            if (apks == null || apks.length == 0) {
                throw new GradleException(
                    "\n" +
                    "assembleRelease produced no APK in ${outputDir}, so nothing could be\n" +
                    "  verified. That is not a pass — see STOURIFY-231.\n")
            }
            apks.each { assertReleaseApkIsSafe(it) }
        }
    }
}

// The fast refusal, same shape and same purpose as the dev one: speed, not safety.
// Measured with --dry-run in both directions, because the leak STOURIFY-234 found
// might have run the other way and did not: `assembleRelease` puts 574 tasks in the
// graph including all four of these, while `assembleReleaseDev` puts 67 :app: tasks
// there and not one of them is a non-Dev release task — not even preReleaseBuild.
def releaseArtifactTasks = [
    "assembleRelease",
    "packageRelease",
    "bundleRelease",
    "createBundleReleaseJsAndAssets",
]
def releaseAnchorPaths = releaseArtifactTasks.collect { "${project.path}:${it}".toString() } as Set
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { releaseAnchorPaths.contains(it.path) }) {
        assertReleaseApiUrlIsSafe()
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation project(':watermelondb-jsi')

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
